default_permission_matcher: bypass_plus
modelgroups:
  polytoken:default_model_full:
    - glm-flash-opencode
    - glm-flash-zai
    - codex-gpt-6-luna(medium)
    - neuralwatt/glm-5.3-flash(medium)

  polytoken:default_model_mini:
    - neuralwatt/glm-5.3-flash(low)
    - glm-flash-opencode
    - glm-flash-zai
    - codex-gpt-6-luna(low)

  polytoken:default_model_nano:
    - glm-flash-opencode
    - glm-flash-zai
    - neuralwatt/glm-5.3-flash(low)

integrations:
    search:
        providers:
            brave:
                enabled: true
                key: ${BRAVE_API_KEY}
            exa:
                enabled: true
                key: ${EXA_API_KEY}
            kagi:
                enabled: true
                key: ${KAGI_API_KEY}
            tavily:
                enabled: true
                key: ${TAVILY_API_KEY}
        strategy: round_robin
mcp_servers:
    github:
        transport: http
        url: https://api.githubcopilot.com/mcp/readonly
        default_enabled: false
    komodo:
        transport: http
        url: http://127.0.0.1:8000/mcp
        default_enabled: false
    home-assistant:
        transport: http
        url: http://10.0.0.16:8123/api/mcp/assist
        default_enabled: false
        # Add auth.value: "Bearer <token>" after setting HA_TOKEN locally.
    playwright:
        transport: stdio
        command: npx
        args: ["-y", "@playwright/mcp@latest"]
        default_enabled: false
    context7:
        transport: http
        url: https://mcp.context7.com/mcp
        default_enabled: false
    arr:
        transport: http
        url: http://127.0.0.1:6060/mcp
        default_enabled: false
    unifi:
        transport: stdio
        command: uvx
        args: ["unifi-network-mcp@latest"]
        default_enabled: false
        pass_env: ["PATH", "UNIFI_HOST", "UNIFI_USERNAME", "UNIFI_PASSWORD"]
    pihole:
        transport: stdio
        command: pihole-mcp
        args: []
        default_enabled: false
        env:
            PIHOLE_READ_ONLY: "true"
        pass_env: ["PATH", "PIHOLE_URL", "PIHOLE_PASSWORD"]
    frigate:
        transport: stdio
        command: uvx
        args: ["--from", "git+https://github.com/jakekeeys/frigate-mcp", "frigate-mcp"]
        default_enabled: false
        pass_env: ["PATH", "FRIGATE_URL"]
models:
    deepseek-flash-opencode:
      provider: opencode-go
      provider_name: deepseek-v4.1-flash
      variant: other
      class: mini
