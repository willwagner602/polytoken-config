providers:
    codex:
        auth:
            profile: default
            type: codex_device
        kind:
            name: codex
            type: catalog
    neuralwatt:
        auth:
            key: ${NEURALWATT_API_KEY}
            type: static_key
        kind:
            name: neuralwatt
            type: catalog
    opencode-go:
        auth:
            key: ${OPENCODE_API_KEY}
            type: static_key
        headers:
            x-opencode-session: c958c9bd-4f2f-448d-b978-aec912a72f75
        kind:
            type: custom_open_ai_compatible
        protocol: openai_chat_completions
        url: https://opencode.ai/zen/go/v1
