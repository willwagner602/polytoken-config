  polytoken:default_model_nano:
    - opencode-glm-5.3-flash
    - zai/glm-5.3-flash
    - neuralwatt/glm-5.3-flash(low)
    - mistral/zai-glm-5-3-flash
    - cloudflare-workers-ai/@cf/zai-org/glm-5.3-flash
    - groq/openai/gpt-oss-120b
    - nvidia-nim/nvidia/nemotron-3.5-lightning-30b-a3b
    - openrouter/z-ai/glm-5.3-flash

integrations:
    search:
        providers:
            brave:
                enabled: false
                key: ${BRAVE_API_KEY}
            exa:
                enabled: true
                key: ${EXA_API_KEY}
            kagi:
                enabled: false
                key: ${KAGI_API_KEY}
            tavily:
                enabled: false
                key: ${TAVILY_API_KEY}
            parallel:
                enabled: true
                key: ${PARALLEL_API_KEY}
            you:
                enabled: false
                key: ${YOU_API_KEY}
        strategy: round_robin
    decisions:
        active: jev-systemone
        backends:
            jev-systemone:
                type: typesafe
                key: ${TYPESAFE_API_KEY}
                model: jev-latest
mcp_servers:
    github:
        transport: http
        url: https://api.githubcopilot.com/mcp/readonly
        default_enabled: false
    komodo:
        transport: http
        url: http://127.0.0.1:8000/mcp
        default_enabled: false
    home-assistant:
        transport: http
        url: http://10.0.0.16:8123/api/mcp/assist
        default_enabled: false
#        auth:
#            type: authorization-header
#            value: "Bearer <token>"
    playwright:
        transport: stdio
        command: npx
        args: ["-y", "@playwright/mcp@latest"]
        default_enabled: false
    context7:
        transport: http
        url: https://mcp.context7.com/mcp
        default_enabled: false
    arr:
        transport: http
        url: http://127.0.0.1:6060/mcp
        default_enabled: false
    unifi:
        transport: stdio
        command: uvx
        args: ["unifi-network-mcp@latest"]
        default_enabled: false
        pass_env: ["PATH", "UNIFI_HOST", "UNIFI_USERNAME", "UNIFI_PASSWORD"]
    pihole:
        transport: stdio
        command: pihole-mcp
        args: []
        default_enabled: false
        env:
            PIHOLE_READ_ONLY: "true"
        pass_env: ["PATH", "PIHOLE_URL", "PIHOLE_PASSWORD"]
    frigate:
        transport: stdio
        command: uvx
        args: ["--from", "git+https://github.com/jakekeeys/frigate-mcp", "frigate-mcp"]
        default_enabled: false
        pass_env: ["PATH", "FRIGATE_URL"]
    woodpecker:
        transport: http
        url: http://127.0.0.1:8001/mcp
        default_enabled: false
        auth:
            type: authorization-header
            value: "Bearer ${WOODPECKER_MCP_TOKEN}"
